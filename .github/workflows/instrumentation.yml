name: Coverage and sanitizers

on:
  pull_request:
  push:
    branches: [master, v2.0.2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  instrumented:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [coverage, asan-ubsan]
    env:
      INSTRUMENT_CXX: clang++-18
      LLVM_COV: llvm-cov-18
      LLVM_PROFDATA: llvm-profdata-18
      ASAN_SYMBOLIZER_PATH: /usr/bin/llvm-symbolizer-18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-18 llvm-18 make python3
      - name: Run every DSP suite
        env:
          MODE: ${{ matrix.mode }}
        run: make "test-$MODE"
      - name: Save reports and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsp-${{ matrix.mode }}
          path: .build/${{ matrix.mode }}/reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
